<!DOCTYPE html><html><head><meta charset="utf-8"></head><body>
<script>
const targets = [
  ["customer-1f475", "../img/1f475.png"],
  ["customer-1f9d3", "../img/1f9d3.png"],
  ["customer-1f9d1-chef", "../img/1f9d1-200d-1f373.png"],
  ["food-1f363", "../img/food/1f363.png"],
  ["chair-1fa91", "../img/1fa91.png"]
];
const out = [];
let pending = targets.length;
for (const [name, src] of targets) {
  const img = new Image();
  img.onload = () => {
    const c = document.createElement("canvas");
    c.width = img.naturalWidth; c.height = img.naturalHeight;
    const ctx = c.getContext("2d");
    ctx.drawImage(img, 0, 0);
    try {
      const d = ctx.getImageData(0, 0, c.width, c.height).data;
      let op = 0, minX = 1e9, minY = 1e9, maxX = -1, maxY = -1;
      for (let y = 0; y < c.height; y++) for (let x = 0; x < c.width; x++) {
        if (d[(y * c.width + x) * 4 + 3] > 20) {
          op++;
          if (x < minX) minX = x; if (x > maxX) maxX = x;
          if (y < minY) minY = y; if (y > maxY) maxY = y;
        }
      }
      out.push(`${name}: ${c.width}x${c.height} opaquePct=${(op / (c.width * c.height) * 100).toFixed(1)} bbox=${minX},${minY}-${maxX},${maxY}`);
    } catch (e) { out.push(name + ": canvas error " + e.message); }
    if (--pending === 0) document.title = out.join(" | ");
  };
  img.onerror = () => { out.push(name + ": LOAD ERROR"); if (--pending === 0) document.title = out.join(" | "); };
  img.src = src;
}
</script></body></html>
